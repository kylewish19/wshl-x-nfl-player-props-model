name: Build NFL game markets v0.1.0
on:
  push:
    paths:
      - '.github/workflows/build_game_markets_v010.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install -e .
      - run: python scripts/update_data.py --config config/game_model_config.yaml
      - run: python scripts/train_game_markets.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-game-markets-v0.1.0
          path: |
            models/game_markets/
            reports/game_markets_v0.1.0.json
