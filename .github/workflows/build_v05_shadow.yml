name: Build v0.5 decomposed shadow challenger
on:
  push:
    paths:
      - '.github/workflows/build_v05_shadow.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: python scripts/update_data.py
      - run: python scripts/train_decomposed_challenger.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-player-props-v0.5-shadow
          path: |
            models/challenger_v05/
            reports/v0.5.0_shadow_decomposed.json
