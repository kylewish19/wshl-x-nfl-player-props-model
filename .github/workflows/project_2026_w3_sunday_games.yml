name: Project Sunday Week 3 game markets
on:
  push:
    paths:
      - .github/workflows/project_2026_w3_sunday_games.yml
permissions:
  actions: read
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Download frozen game models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10670106852/zip" -o /tmp/game.zip
          unzip -q /tmp/game.zip -d .
      - run: python scripts/update_data.py --config config/game_model_config.yaml
      - run: python scripts/predict_game_markets.py inputs/live/2026_w3_sunday_game_markets.csv --out predictions/2026_w3_sunday_game_markets.csv --model-root models/game_markets
      - uses: actions/upload-artifact@v4
        with:
          name: sunday-w3-game-markets
          path: predictions/2026_w3_sunday_game_markets.csv
