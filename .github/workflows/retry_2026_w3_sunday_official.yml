name: Retry Sunday Week 3 official projections
on:
  push:
    paths:
      - .github/workflows/retry_2026_w3_sunday_official.yml
permissions:
  actions: read
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Download frozen official models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10692302469/zip" -o /tmp/official.zip
          unzip -q /tmp/official.zip -d .
      - run: python scripts/update_data.py
      - run: python scripts/project_full_slate_fast.py --date 2026-09-27 --mode official --model-root models/official --out predictions/2026_w3_sunday_official_fast.csv
      - uses: actions/upload-artifact@v4
        with:
          name: sunday-w3-official-fast-retry
          path: predictions/2026_w3_sunday_official_fast.csv
