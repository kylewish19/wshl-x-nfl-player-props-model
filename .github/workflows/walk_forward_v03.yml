name: Walk-forward v0.2 vs v0.3
on:
  push:
    paths:
      - '.github/workflows/walk_forward_v03.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: python scripts/update_data.py
      - run: python scripts/walk_forward_compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: walk-forward-v02-v03
          path: reports/walk_forward_v02_vs_v03.json
