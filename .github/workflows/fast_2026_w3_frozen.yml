name: Fast Week 3 frozen-model predictions
on:
  push:
    paths:
      - '.github/workflows/fast_2026_w3_frozen.yml'
permissions:
  actions: read
  contents: read
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: |
          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10692302469/zip -o /tmp/official.zip
          unzip -q /tmp/official.zip -d .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/update_data.py
      - run: python scripts/filter_known_players.py inputs/live/2026_w3_atl_gb_official_props.csv --out /tmp/known.csv --missing predictions/2026_w3_atl_gb_missing_players_fast.csv
      - run: python scripts/predict_props.py /tmp/known.csv --out predictions/2026_w3_atl_gb_official_fast.csv --model-root models/official
      - uses: actions/upload-artifact@v4
        with:
          name: atl-gb-week3-official-fast
          path: |
            predictions/2026_w3_atl_gb_official_fast.csv
            predictions/2026_w3_atl_gb_missing_players_fast.csv
  v05:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: |
          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10666874411/zip -o /tmp/v05.zip
          unzip -q /tmp/v05.zip -d .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/update_data.py
      - run: python scripts/predict_props.py inputs/live/2026_w3_atl_gb_v05_shadow.csv --out predictions/2026_w3_atl_gb_v05_fast.csv --model-root models/challenger_v05
      - uses: actions/upload-artifact@v4
        with:
          name: atl-gb-week3-v05-fast
          path: predictions/2026_w3_atl_gb_v05_fast.csv
