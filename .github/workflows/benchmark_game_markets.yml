name: Benchmark NFL closing game markets
on:
  push:
    paths:
      - '.github/workflows/benchmark_game_markets.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt && pip install -e .
      - run: python scripts/update_data.py --config config/game_model_config.yaml --no-pbp
      - run: python scripts/benchmark_game_markets.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-game-market-closing-benchmarks
          path: reports/game_market_closing_benchmarks.json
