name: SNF Rams Broncos frozen props
on:
  push:
    paths:
      - '.github/workflows/run_2026_w3_snf.yml'
permissions:
  actions: read
  contents: read
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: |
          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10692302469/zip -o /tmp/official.zip
          unzip -q /tmp/official.zip -d .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/update_data.py
      - run: python scripts/predict_props.py inputs/live/2026_w3_lar_den_snf.csv --out predictions/2026_w3_lar_den_snf_official.csv --model-root models/official
      - uses: actions/upload-artifact@v4
        with:
          name: lar-den-snf-official
          path: predictions/2026_w3_lar_den_snf_official.csv
  v05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: |
          curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10666874411/zip -o /tmp/v05.zip
          unzip -q /tmp/v05.zip -d .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/update_data.py
      - run: python scripts/predict_props.py inputs/live/2026_w3_lar_den_snf.csv --out predictions/2026_w3_lar_den_snf_v05.csv --model-root models/challenger_v05
      - uses: actions/upload-artifact@v4
        with:
          name: lar-den-snf-v05
          path: predictions/2026_w3_lar_den_snf_v05.csv
