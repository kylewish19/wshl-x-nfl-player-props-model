name: Build v0.4 matchup shadow challenger
on:
  push:
    paths:
      - '.github/workflows/build_v04_shadow.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: python scripts/update_data.py
      - run: python scripts/audit_data.py
      - run: python scripts/train_matchup_challenger.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-player-props-v0.4-shadow
          path: |
            models/challenger_v04/
            reports/v0.4.0_shadow_matchup.json
            reports/data_audit.json
