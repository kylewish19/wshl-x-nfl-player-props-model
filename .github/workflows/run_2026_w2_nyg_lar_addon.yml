name: Giants Rams addon props
on:
  push:
    paths:
      - '.github/workflows/run_2026_w2_nyg_lar_addon.yml'
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - run: python scripts/update_data.py
      - run: python scripts/train_addon_props.py
      - run: python scripts/predict_props.py inputs/live/2026_w2_nyg_lar_addon_props.csv --out predictions/2026_w2_nyg_lar_addon.csv --model-root models/addon_v01
      - uses: actions/upload-artifact@v4
        with:
          name: giants-rams-addon-card
          path: |
            predictions/2026_w2_nyg_lar_addon.csv
            reports/addon_v0.1.0_validation.json
