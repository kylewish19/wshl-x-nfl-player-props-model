name: Price Sunday Week 3 shortlist
on:
  push:
    paths:
      - .github/workflows/price_2026_w3_sunday_shortlist.yml
permissions:
  actions: read
  contents: read
jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Download frozen official models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10692302469/zip" -o /tmp/m.zip
          unzip -q /tmp/m.zip -d .
      - run: python scripts/update_data.py
      - run: python scripts/predict_props.py inputs/live/2026_w3_sunday_shortlist.csv --out predictions/2026_w3_sunday_shortlist_official.csv --model-root models/official
      - uses: actions/upload-artifact@v4
        with:
          name: sunday-w3-shortlist-official
          path: predictions/2026_w3_sunday_shortlist_official.csv
  v05:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Download frozen v05 models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10666874411/zip" -o /tmp/m.zip
          unzip -q /tmp/m.zip -d .
      - run: python scripts/update_data.py
      - run: python scripts/predict_props.py inputs/live/2026_w3_sunday_shortlist.csv --out predictions/2026_w3_sunday_shortlist_v05.csv --model-root models/challenger_v05
      - uses: actions/upload-artifact@v4
        with:
          name: sunday-w3-shortlist-v05
          path: predictions/2026_w3_sunday_shortlist_v05.csv
