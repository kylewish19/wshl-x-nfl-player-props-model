name: Week 12 fixed v0.5 challenger refit
on:
  push:
    paths:
      - '.github/workflows/refit_2026_w12_v05.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt && pip install -e .
      - name: Restore frozen v0.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/kylewish19/wshl-x-nfl-player-props-model/actions/artifacts/10666874411/zip" -o /tmp/v05.zip
          unzip -oq /tmp/v05.zip -d .
      - run: python scripts/update_data.py
      - name: Verify training cutoff
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          from wshlx_nfl_props.data import load_raw
          from wshlx_nfl_props.enrichment import _clean_team
          a=json.loads(Path("reports/2026_w12_restart_data_audit.json").read_text())
          assert a["core_pass"]
          cutoff=pd.Timestamp("2026-11-26T14:27:00Z")
          d=load_raw()
          s=d["schedules"]
          reg=s[(s.season==2026)&(s.game_type=="REG")].copy()
          reg["kickoff"]=pd.to_datetime(reg.gameday.astype(str)+" "+reg.gametime.astype(str),errors="coerce").dt.tz_localize("America/New_York",ambiguous="NaT",nonexistent="NaT").dt.tz_convert("UTC")
          assert reg.kickoff.notna().all()
          expected=reg[reg.kickoff<cutoff]
          completed=expected[expected.home_score.notna()&expected.away_score.notna()]
          assert len(completed)==len(expected)==a["completed_games"]==164
          assert not ((reg.kickoff>=cutoff)&(reg.home_score.notna()|reg.away_score.notna())).any(),"Later games already present; require a new audited cutoff"
          keys={(int(r.week),_clean_team(t)) for r in completed.itertuples() for t in (r.home_team,r.away_team)}
          for name,cols in {"player_stats":["recent_team","team","club"],"team_stats":["team","recent_team","club"],"snap_counts":["team","recent_team","club"],"pbp":["posteam"]}.items():
              x=d[name]
              col=next(c for c in cols if c in x)
              x=x[x.season==2026]
              observed={(int(w),_clean_team(t)) for w,t in zip(x.week,x[col]) if pd.notna(w) and pd.notna(t)}
              assert observed==keys, f"{name}: missing or unexpected team-weeks"
          p=d["pbp"]
          assert set(p.loc[p.season==2026,"game_id"].dropna().astype(str))==set(completed.game_id.astype(str))
          Path("reports/2026_w12_v05_cutoff.json").write_text(json.dumps({"cutoff_utc":str(cutoff),"completed_games":len(completed),"status":"verified","previous_artifact":10666874411,"specification":"v0.5.0-shadow unchanged"},indent=2))
          PY
      - run: python scripts/refit_frozen_v05.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-props-v05-week12-20261126-fixed
          retention-days: 90
          path: |
            models/challenger_v05/
            reports/2026_w12_v05_refit.json
            reports/2026_w12_v05_cutoff.json
      - name: Record refit provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/2026_w12_v05_refit.json reports/2026_w12_v05_cutoff.json
          git commit -m "Record Week 12 fixed v0.5 refit" || exit 0
          git pull --rebase
          git push
